<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriEye - Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

<div class="glass-panel" style="width: 100%; max-width: 440px; padding: 40px; text-align: center;">
    <div class="brand-section" style="margin-bottom: 30px;">
        <h1 class="brand-title" style="font-size: 2.8rem; display: inline-flex; align-items: center; gap: 8px;">
            👁 NutriEye
        </h1>
        <p class="subtitle" style="font-size: 0.95rem; margin-top: 6px;">Set New Password</p>
    </div>

    <!-- FLASHED MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/reset-password/{{ token }}" method="POST" style="display: flex; flex-direction: column; gap: 20px; text-align: left;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="Min. 8 characters" required autocomplete="new-password">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
            Save New Password
        </button>
    </form>
</div>

</body>
</html>
